name: build-acr

# 可选：推送到阿里云容器镜像服务（ACR）。国内拉取比 GHCR 快很多。
# 使用前在仓库 Settings > Secrets and variables > Actions 里添加：
#   ACR_REGISTRY   例如 registry.cn-hangzhou.aliyuncs.com
#   ACR_NAMESPACE  你的命名空间，例如 meyzh
#   ACR_USERNAME   阿里云账号（或固定 AccessKey 用户名）
#   ACR_PASSWORD   阿里云容器镜像服务的固定密码
# 然后在 Actions 页面手动点 Run workflow 触发。

on:
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/p910nd-panel

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
