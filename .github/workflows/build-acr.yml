name: build-acr

# 推送到阿里云容器镜像服务（ACR）。国内拉取比 GHCR 快很多。
#
# 需要先在仓库 Settings > Secrets and variables > Actions 里配置：
#   ACR_REGISTRY    仓库地址，例如 registry.cn-hangzhou.aliyuncs.com
#   ACR_NAMESPACE   命名空间，例如 godr
#   ACR_USERNAME    阿里云账号（或容器镜像服务的固定用户名）
#   ACR_PASSWORD    容器镜像服务「访问凭证」里设置的固定密码
#
# 前两个填在 Variables 或 Secrets 里都行，脚本会先读 Variables 再读 Secrets，
# 所以不用改这个文件就能换仓库/命名空间。
#
# 拼出来的镜像地址 = <ACR_REGISTRY>/<ACR_NAMESPACE>/p910nd-panel
#
# 【为什么只构建一个架构】
# 阿里云 ACR 个人版（免费版）不支持多架构镜像（manifest list），
# 一次推 amd64+arm64 会在 Build and push 步骤被拒绝。
# 所以这里保持单架构，运行时可手动选 amd64 或 arm64。
# 绝大多数 x86 机器（含飞牛 NAS）选 linux/amd64 即可；
# 树莓派、部分 ARM 群晖/极空间选 linux/arm64。

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "目标架构（x86 机器选 amd64，ARM 机器选 arm64）"
        required: true
        default: "linux/amd64"
        type: choice
        options:
          - linux/amd64
          - linux/arm64

env:
  ACR_REGISTRY: ${{ vars.ACR_REGISTRY || secrets.ACR_REGISTRY }}
  ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE || secrets.ACR_NAMESPACE }}
  IMAGE: ${{ vars.ACR_REGISTRY || secrets.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE || secrets.ACR_NAMESPACE }}/p910nd-panel

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show target
        run: |
          echo "仓库地址：${{ env.ACR_REGISTRY }}"
          echo "命名空间：${{ env.ACR_NAMESPACE }}"
          echo "完整镜像：${{ env.IMAGE }}"
          echo "目标架构：${{ inputs.platform }}"
          if [ -z "${{ env.ACR_REGISTRY }}" ] || [ -z "${{ env.ACR_NAMESPACE }}" ]; then
            echo "::error::ACR_REGISTRY 或 ACR_NAMESPACE 未配置，请在 Settings > Secrets and variables > Actions 里补上"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platform }}
          push: true
          # 阿里云 ACR 个人版会拒收 buildx 默认附带的多架构/attestation 清单，
          # 报错形如：denied: unknown manifest class for application/vnd.oci.empty.v1+json
          # 关掉这两个证明清单，只推单一普通镜像，就没问题了。
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
