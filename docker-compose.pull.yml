# 镜像部署版：不构建，直接 pull 现成镜像
#
# 默认从 GHCR 拉取，一条地址包含 amd64 / arm64 / arm-v7 / 386 四种架构，按设备自动匹配。
# 要用自己的镜像仓库，在 .env 里写 PANEL_IMAGE 覆盖即可。
#
# 部署： docker compose -f docker-compose.pull.yml pull && docker compose -f docker-compose.pull.yml up -d
# 升级： docker compose -f docker-compose.pull.yml pull && docker compose -f docker-compose.pull.yml up -d

services:
  p910nd-panel:
    image: ${PANEL_IMAGE:-ghcr.io/meyzh/p910nd-panel:latest}
    container_name: p910nd-panel
    restart: unless-stopped
    privileged: true
    ports:
      - "${PANEL_HTTP_PORT:-8910}:8910"
      - "${PANEL_PRINT_PORT:-9100}:9100"
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - ./data:/app/data
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - PRINTER_ID=${PRINTER_ID:-}
      - PUSHPLUS_TOKEN=${PUSHPLUS_TOKEN:-}
      - PUSHPLUS_CHANNEL=${PUSHPLUS_CHANNEL:-wechat}
      - PUSHPLUS_OPTION=${PUSHPLUS_OPTION:-}
      - PUSHPLUS_TO=${PUSHPLUS_TO:-}
      - PUSHPLUS_TOPIC=${PUSHPLUS_TOPIC:-}
      - PUSH_ENABLE=${PUSH_ENABLE:-1}
      - OFFLINE_ALERT_SEC=${OFFLINE_ALERT_SEC:-60}
      - JOB_FAIL_PUSH=${JOB_FAIL_PUSH:-1}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
