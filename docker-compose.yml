services:
  p910nd-panel:
    build: .
    image: p910nd-panel:latest
    container_name: p910nd-panel
    restart: unless-stopped
    # 给 NAS 的网页终端留一个可交互的 TTY（部分 NAS 的“终端”按钮依赖这两行）
    stdin_open: true
    tty: true
    privileged: true
    # 必须用 host 网络：bridge 模式下容器看到的所有来源 IP 都是 docker 网关地址
    # （172.x），反查不到真实主机名，来源管理就无法按设备归并。
    # host 模式下容器直接用 NAS 的网络栈，9100 / 8910 本身就在 NAS 上监听，
    # 所以这里不要再写 ports（写了也会被 Docker 忽略）。
    # 注意：改之前确认 NAS 上 9100、8910 没被别的服务占用。
    network_mode: host
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      # 配置、账号、推送设置、打印任务记录都持久化在这里
      - ./data:/app/data
      # 面板代码直接挂载：以后改了 panel.py 只要 restart 容器就生效，
      # 不需要重新 build 镜像（NAS 上拉 debian 基础镜像经常 401/超时）
      - ./panel.py:/app/panel.py:ro
    environment:
      - TZ=Asia/Shanghai
      # host 模式下端口就是 NAS 的 9100 / 8910；被占用时改这两行
      # - WEB_PORT=8911
      # - PRINT_PORT=9101
      # 注意：这里不再配置账号密码。
      # 第一次打开 http://NAS的IP:8910 时，页面会让你自己设置一个访问密码（只有密码，没有用户名），
      # 密码只以哈希形式存在 ./data/config.json 里，不会出现在环境变量或日志中。
      # ---- 首次启动的默认打印设备 ID，之后在网页「设备设置」里改 ----
      - PRINTER_ID=
      # ---- 首次启动的默认推送参数，之后统一在网页「推送配置」里改 ----
      - PUSHPLUS_TOKEN=
      - PUSHPLUS_CHANNEL=wechat
      - PUSHPLUS_OPTION=
      - PUSHPLUS_TO=
      - PUSHPLUS_TOPIC=
      - PUSH_ENABLE=1
      - OFFLINE_ALERT_SEC=60
      - JOB_FAIL_PUSH=1
      # 打印监控保留多少条任务记录（默认 1000，最小 100）
      - JOB_KEEP=1000
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
